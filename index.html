<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="script.js"></script>
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <div class="calculator-body">
      <div class="view-port">
        <div class="queued-num"></div>
        <div class="live-num">0</div>
      </div>
      <div class="buttons-port">
        <div class="left-quadrant">
            <div class="clear-container">
                <button>clear</button>
            </div>
            <div class="calculator-buttons">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>+/-</button>
                <button>0</button>
                <button>.</button>
            </div>
        </div>
        <div class="right-quadrant">
            <div class="calculator-ops">
                <button>+</button>
                <button>-</button>
                <button>&times;</button>
                <button>&div;</button>
                <button>=</button>
            </div>
        </div>
      
      </div>
    </div>
</body>
</html>
